<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--heading tags in html-->
    <h1>Hello</h1>
    <h2>Hello</h2>
    <h3>Hello</h3>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>

    <div>

            <!-- description title -->
            <dt><h1>This is description title</h1></dt>
            <!-- description data -->
            <dd>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste dolores vel ratione tempora deleniti autem quod molestiae dicta sint inventore laboriosam impedit natus architecto, voluptate commodi facere? Iusto, animi facere!</dd>
        </dl>

    <!-- horizontal line -->
     <!--self closing tag-->
    <hr>
